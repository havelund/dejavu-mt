<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DejaVuMT</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #26282c; --edge: #3a3d42; --fg: #d6d8dc;
    --dim: #8b8f97; --green: #4cbf6b; --red: #e35f5f; --yellow: #d9b23c;
    --accent: #5b9dd9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
           padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 17px; margin: 0 10px 0 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  select, button { background: #2f3238; color: var(--fg);
        border: 1px solid var(--edge); border-radius: 5px;
        padding: 5px 10px; font-size: 13px; }
  button#run { background: var(--accent); border-color: var(--accent);
               color: #10121a; font-weight: 600; padding: 5px 22px;
               cursor: pointer; }
  button#run:disabled { opacity: .5; cursor: wait; }
  label.opt { color: var(--dim); font-size: 13px; user-select: none; }
  label.opt input { vertical-align: -2px; }
  main { padding: 14px 16px; }
  .editors { display: flex; gap: 12px; }
  .editors > div { flex: 1; display: flex; flex-direction: column; }
  .editors .caption { color: var(--dim); font-size: 12px; margin: 0 0 4px 2px;
                      text-transform: uppercase; letter-spacing: .05em; }
  textarea { width: 100%; height: 220px; resize: vertical;
        background: var(--panel); color: var(--fg);
        border: 1px solid var(--edge); border-radius: 6px; padding: 10px;
        font: 13px/1.5 "SF Mono", Menlo, Consolas, monospace;
        white-space: pre; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #error { display: none; margin: 12px 0 0; padding: 10px 12px;
           background: #3a2426; border: 1px solid #7a3a3e; border-radius: 6px;
           color: #f0b6b6; font-family: Menlo, Consolas, monospace;
           white-space: pre-wrap; }
  #summary { margin: 14px 0 6px; color: var(--dim); }
  #summary b.ok { color: var(--green); }
  #summary b.bad { color: var(--red); }
  button.mini { font-size: 12px; padding: 2px 9px; margin-left: 8px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #2a2d32; }
  table.trace { border-collapse: collapse; margin-top: 6px; width: 100%; }
  table.trace th { text-align: left; color: var(--dim); font-weight: 500;
        font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
        padding: 4px 14px 4px 6px; border-bottom: 1px solid var(--edge); }
  table.trace td { padding: 3px 14px 3px 6px; border-bottom:
        1px solid #2c2e33; font-family: Menlo, Consolas, monospace;
        font-size: 13px; vertical-align: top; }
  td.holds { color: var(--green); }
  td.viol { color: var(--red); font-weight: 600; }
  tr.violrow td:first-child { border-left: 3px solid var(--red); }
  tr.treerow.hidden { display: none; }
  .treename { color: var(--dim); font-size: 12px; margin: 4px 0 0 2px; }
  pre.tree { margin: 6px 0 6px; padding: 10px 12px; background: var(--panel);
        border: 1px solid var(--edge); border-radius: 6px; overflow-x: auto;
        font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace; }
  .tv { color: var(--green); }
  .fv { color: var(--red); }
  .ov { color: var(--yellow); }
  .props { color: var(--dim); font-family: Menlo, Consolas, monospace;
           font-size: 13px; margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>DejaVu<span>MT</span></h1>
  <select id="examples"><option value="">example…</option></select>
  <button id="run">Run</button>
  <select id="solver">
    <option value="z3">z3</option>
    <option value="cvc5">cvc5</option>
  </select>
  <label class="opt"><input type="checkbox" id="debug" checked> formula trees</label>
  <label class="opt"><input type="checkbox" id="strong"> strong</label>
  <label class="opt"><input type="checkbox" id="weak"> weak</label>
  <label class="opt"><input type="checkbox" id="gc"> gc</label>
</header>
<main>
  <div class="editors">
    <div>
      <div class="caption">specification (.qtl)</div>
      <textarea id="spec" spellcheck="false"></textarea>
    </div>
    <div>
      <div class="caption">log (.csv — timed specs: last column is the timestamp)</div>
      <textarea id="log" spellcheck="false"></textarea>
    </div>
  </div>
  <div id="error"></div>
  <div id="results"></div>
</main>
<script>
const $ = id => document.getElementById(id);

async function loadExamples() {
  const names = await (await fetch('/examples')).json();
  for (const n of names) {
    const o = document.createElement('option');
    o.value = o.textContent = n;
    $('examples').appendChild(o);
  }
}
$('examples').onchange = async () => {
  const n = $('examples').value;
  if (!n) return;
  const d = await (await fetch('/examples/' + encodeURIComponent(n))).json();
  $('spec').value = d.spec || '';
  $('log').value = d.log || '';
  $('results').innerHTML = '';
  $('error').style.display = 'none';
};

$('run').onclick = async () => {
  $('run').disabled = true;
  $('error').style.display = 'none';
  $('results').innerHTML = '<div id="summary">running…</div>';
  try {
    const r = await fetch('/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        spec: $('spec').value, log: $('log').value,
        solver: $('solver').value, debug: $('debug').checked,
        strong: $('strong').checked, weak: $('weak').checked,
        gc: $('gc').checked,
      })
    });
    render(await r.json());
  } catch (e) {
    showError(String(e));
  } finally {
    $('run').disabled = false;
  }
};

function showError(msg) {
  $('results').innerHTML = '';
  $('error').textContent = msg;
  $('error').style.display = 'block';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function render(res) {
  if (res.error) { showError(res.error); return; }
  const nv = res.violations.length;
  const hasTrees = res.events.some(ev => ev.trees);
  let h = `<div id="summary">${res.events.length} events, ` +
    (nv ? `<b class="bad">${nv} violation(s)</b>` : `<b class="ok">no violations</b>`) +
    ` &nbsp;·&nbsp; solver: ${res.solver}` + (res.timed ? ' · timed' : '') +
    (res.truncated ? ` · <b class="bad">${res.truncated}</b>` : '') +
    (hasTrees ? `<button class="mini" id="expandall">expand all</button>` +
                `<button class="mini" id="collapseall">collapse all</button>` : '') +
    `</div>`;
  h += '<div class="props">' + res.properties.map(p =>
        `${esc(p.name)} : ${esc(p.text)}`).join('<br>') + '</div>';
  const props = res.properties.map(p => p.name);
  h += '<table class="trace"><tr><th>#</th><th>event</th>' +
       (res.timed ? '<th>time</th>' : '') +
       props.map(p => `<th>${esc(p)}</th>`).join('') + '</tr>';
  for (const ev of res.events) {
    const anyViol = props.some(p => !ev.verdicts[p]);
    const cls = [anyViol ? 'violrow' : '', ev.trees ? 'clickable evrow' : '']
        .join(' ').trim();
    h += `<tr${cls ? ` class="${cls}"` : ''} data-nr="${ev.nr}"` +
         `${ev.trees ? ' title="click to toggle formula trees"' : ''}>` +
         `<td>${ev.nr}</td><td>${esc(ev.fact)}</td>` +
         (res.timed ? `<td>${ev.ts}</td>` : '') +
         props.map(p => ev.verdicts[p]
             ? '<td class="holds">holds</td>'
             : '<td class="viol">VIOLATED</td>').join('') + '</tr>';
    if (ev.trees) {
      h += `<tr class="treerow${anyViol ? '' : ' hidden'}" data-nr="${ev.nr}">` +
           `<td></td><td colspan="${props.length + (res.timed ? 2 : 1)}">`;
      for (const t of ev.trees) {
        if (props.length > 1) h += `<div class="treename">${esc(t.name)}</div>`;
        h += `<pre class="tree">${t.html}</pre>`;
      }
      h += '</td></tr>';
    }
  }
  h += '</table>';
  $('results').innerHTML = h;
  if (hasTrees) {
    const setAll = show => document.querySelectorAll('tr.treerow')
        .forEach(r => r.classList.toggle('hidden', !show));
    $('expandall').onclick = () => setAll(true);
    $('collapseall').onclick = () => setAll(false);
    document.querySelectorAll('tr.evrow').forEach(row => {
      row.onclick = () => document.querySelector(
          `tr.treerow[data-nr="${row.dataset.nr}"]`)
          .classList.toggle('hidden');
    });
  }
}

loadExamples();
</script>
</body>
</html>
